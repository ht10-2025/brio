<!DOCTYPE html>
<html>
  <head>
    <title>Momento de Alegria</title>
    <!-- Cargamos las librerias de codigo abierto de A-Frame y AR.js -->
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <!-- Inicializamos la escena de Realidad Aumentada sin interfaces molestas -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
      
      <!-- Usamos un marcador de matriz tipo codigo de barras (Barcode), que es compatible con estructuras de QR simplificados -->
      <a-marker type="barcode" value="5">
        
        <!-- Tu mensaje flotante en 3D -->
        <a-text 
          value="¡Estas haciendolo genial!\nTu sonrisa cambia el dia." 
          position="0 0.5 0" 
          rotation="-90 0 0" 
          color="#4CC3D9" 
          align="center" 
          width="5">
        </a-text>
        
      </a-marker>
      
      
    </a-scene>
  </body>
</html>
