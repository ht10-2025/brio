<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Portal AR Inicial ✨</title>
    
    <!-- Cargamos un lector de QR nativo ultra rápido y ligero (Evita pantallas negras) -->
    <script src="https://jsdelivr.net"></script>
    
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background-color: #000; }
      
      /* Video de la cámara de fondo */
      #video-camara { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
      
      /* Canvas oculto que procesa las imágenes del QR en segundo plano */
      #canvas-oculto { display: none; }

      /* Interfaz de guía para el usuario */
      #guia-escaneo {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; justify-content: space-between; align-items: center;
        padding: 40px 20px; box-sizing: border-box; z-index: 5; pointer-events: none;
      }
      .cuadro-mira {
        width: 220px; height: 220px; border: 3px dashed #00ff96; border-radius: 20px;
        box-shadow: 0 0 15px rgba(0, 255, 150, 0.4); margin: auto;
      }

      /* Mensaje sorpresa que SOLO aparece si se lee el QR */
      #mensaje-aliento {
        display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(15, 32, 39, 0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border: 2px solid #FF8D1A; padding: 30px 20px; border-radius: 24px; text-align: center;
        width: 280px; box-sizing: border-box; box-shadow: 0 15px 35px rgba(0,0,0,0.6); z-index: 10;
      }
      .mostrar-mensaje { display: block !important; animation: brotar 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
      @keyframes brotar { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
    </style>
  </head>
  <body>

    <!-- Cámara en vivo continua -->
    <video id="video-camara" autoplay playsinline muted></video>
    <canvas id="canvas-oculto"></canvas>

    <!-- Guía visual en pantalla -->
    <div id="guia-escaneo">
      <h2 style="margin: 0; font-size: 18px; color: #00ff96; text-shadow: 0 2px 4px #000;">MODO ESCÁNER ACTIVO</h2>
      <div class="cuadro-mira"></div>
      <p style="font-size: 14px; background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px;">
        Apunta al QR para activar tu mensaje
      </p>
    </div>

    <!-- El Mensaje Oculto -->
    <div id="mensaje-aliento">
      <span style="font-size: 32px;">✨</span>
      <h2 style="font-size: 22px; margin: 10px 0; color: #FF8D1A;">¡Validación Correcta!</h2>
      <p style="font-size: 16px; line-height: 1.5; margin: 0; color: #fff;">
        ¡Lo estás haciendo genial!<br>Tu sonrisa cambia el día.
      </p>
      <button onclick="window.location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #FF5733; color: white; border: none; border-radius: 15px; font-weight: bold; cursor: pointer;">Volver a Escanear</button>
    </div>

    <script>
      const video = document.getElementById('video-camara');
      const canvas = document.getElementById('canvas-oculto');
      const ctx = canvas.getContext('2d');
      const mensaje = document.getElementById('mensaje-aliento');
      const guia = document.getElementById('guia-escaneo');
      let escaneoActivo = true;

      // Encendemos la cámara trasera nativa de forma obligatoria
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(function(stream) {
        video.srcObject = stream;
        // Iniciamos el bucle de lectura cuadro por cuadro de video
        requestAnimationFrame(procesarCamara);
      });

      function procesarCamara() {
        if (!escaneoActivo) return;

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          canvas.height = video.videoHeight;
          canvas.width = video.videoWidth;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          
          // Extraemos los pixeles de la cámara en vivo
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          
          // La librería jsQR analiza si esos pixeles contienen tu QR físico
          const codigoQR = jsQR(imageData.data, imageData.width, imageData.height, {
            inversionAttempts: "dontInvert",
          });

          // SI ENCUENTRA EL QR, ACTIVA EL MENSAJE
          if (codigoQR) {
            escaneoActivo = false; // Detiene el bucle para no repetir el mensaje
            guia.style.display = 'none'; // Quita la mira verde
            mensaje.classList.add('mostrar-mensaje'); // Muestra el mensaje de aliento
          }
        }
        requestAnimationFrame(procesarCamara);
      }
    </script>
  </body>
</html>
