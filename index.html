<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Momento de Alegría ✨</title>
    <style>
      /* Fondo animado moderno con degradado para simular energía */
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #0f2027 100%);
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        color: white; text-align: center; box-sizing: border-box;
      }

      /* Contenedor principal con efecto de cristal (Glassmorphism) */
      .tarjeta {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 24px; padding: 35px 25px; margin: 20px;
        max-width: 320px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        transition: all 0.4s ease;
      }

      /* Círculo animado central que simula un escáner */
      .escaner-anillo {
        width: 100px; height: 100px; border-radius: 50%;
        border: 4px dashed rgba(255, 87, 51, 0.6);
        margin: 0 auto 25px auto; display: flex; justify-content: center; align-items: center;
        animation: rotar 8s linear infinite; position: relative;
      }
      .escaner-anillo::after {
        content: '✨'; font-size: 32px; animation: parpadeo 1.5s infinite alternate;
      }

      button {
        padding: 16px 36px; font-size: 18px; border: none; border-radius: 30px;
        background: linear-gradient(45deg, #FF5733, #FF8D1A); color: white; font-weight: bold; 
        cursor: pointer; margin-top: 15px; box-shadow: 0 5px 20px rgba(255,87,51,0.4);
        transition: transform 0.2s, box-shadow 0.2s; width: 100%;
      }
      button:active { transform: scale(0.96); }

      /* Animación del mensaje motivacional cuando aparece */
      .mensaje-revelado {
        font-size: 22px; font-weight: 600; line-height: 1.5; color: #fff;
        text-shadow: 0 2px 10px rgba(255,255,255,0.2); animation: aparecer 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      @keyframes rotar { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes parpadeo { 0% { opacity: 0.4; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1.1); } }
      @keyframes aparecer { 0% { opacity: 0; transform: scale(0.7); } 100% { opacity: 1; transform: scale(1); } }
    </style>
  </head>
  <body>

    <div class="tarjeta" id="contenedor">
      <div class="escaner-anillo" id="icono"></div>
      <div id="pantalla-contenido">
        <h2 style="font-size: 24px; margin: 0 0 10px 0;">Portal de Bienestar</h2>
        <p style="font-size: 15px; color: #e0e0e0; line-height: 1.5; margin-bottom: 20px;">
          Esta tarjeta digital contiene un mensaje de aliento exclusivo generado para ti.
        </p>
        <button onclick="revelarMensaje()">¡Descubrir Mensaje!</button>
      </div>
    </div>

    <script>
      function revelarMensaje() {
        const contenido = document.getElementById('pantalla-contenido');
        const icono = document.getElementById('icono');
        
        // Cambiamos el icono a un modo activo radiante
        icono.style.border = "4px solid #FF8D1A";
        icono.style.animation = "parpadeo 0.5s infinite alternate";
        
        // Efecto rápido de "procesamiento" (0.5 segundos) antes de mostrar la magia
        contenido.innerHTML = `<p style="font-size: 16px; color: #FF8D1A; font-weight: bold; margin: 20px 0;">Sincronizando energía...</p>`;
        
        setTimeout(() => {
          // Reemplazamos por el mensaje final con su animación impecable
          contenido.innerHTML = `
            <div class="mensaje-revelado">
              ¡Lo estás haciendo genial!<br>
              <span style="color: #FF8D1A; font-size: 16px; font-weight: normal; display:block; margin-top:15px;">
                Sonríe, tu esfuerzo realmente vale la pena.
              </span>
            </div>
            <button onclick="window.location.reload()" style="background: rgba(255,255,255,0.15); box-shadow: none; font-size: 14px; padding: 10px; margin-top: 25px;">Volver a leer</button>
          `;
        }, 600);
      }
    </script>
  </body>
</html>
