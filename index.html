<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mensaje de Alegría AR</title>
    
    <!-- CDNs ultra-rápidos y optimizados para carga inmediata en móviles -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #121212; }
      #interfaz-inicio {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        background: radial-gradient(circle, #2c3e50 0%, #000000 100%); z-index: 9999; color: white; text-align: center; padding: 20px;
      }
      button {
        padding: 16px 36px; font-size: 18px; border: none; border-radius: 30px;
        background: linear-gradient(45deg, #FF5733, #FF8D1A); color: white; font-weight: bold; 
        cursor: pointer; margin-top: 25px; box-shadow: 0 4px 15px rgba(255,87,51,0.4);
        transition: transform 0.2s;
      }
      button:active { transform: scale(0.95); }
    </style>
  </head>
  <body>

    <div id="interfaz-inicio">
      <h2 style="font-size: 26px; margin-bottom: 10px;">✨ Portal de Bienestar ✨</h2>
      <p style="color: #ccc; max-width: 280px; line-height: 1.5;">Presiona el botón para activar la cámara y descubrir tu mensaje.</p>
      <button onclick="iniciarExperiencia()">¡Activar Magia!</button>
    </div>

    <!-- Forzamos la aceleración por hardware con loggy y precision en los sensores -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; sourceWidth:1280; sourceHeight:720; displayWidth:1280; displayHeight:720;" vr-mode-ui="enabled: false">
      
      <a-marker preset="hiro">
        <a-text 
          value="¡Lo estas haciendo genial!\nTu sonrisa cambia el dia." 
          position="0 0.6 0" 
          rotation="-90 0 0" 
          color="#FF5733" 
          align="center" 
          width="4"
          font="aileron">
        </a-text>
      </a-marker>

      
    </a-scene>

    <script>
      function iniciarExperiencia() {
        document.getElementById('interfaz-inicio').style.display = 'none';
        const scene = document.querySelector('a-scene');
        if (scene) { scene.resize(); }
      }
    </script>
  </body>
</html>
