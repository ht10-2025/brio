<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsualizacion - Mensaje de Alegria</title>
    <!-- Cargamos las librerías estables de código abierto de A-Frame y AR.js -->
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <!-- Inicializamos la escena de Realidad Aumentada -->
    <!-- debugUIEnabled: false oculta los textos de carga molestos en el celular -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Usamos el marcador predeterminado "hiro" para hacer tus pruebas locales en VS Code -->
      <a-marker preset="hiro">
        
        <!-- Mensaje flotante animado -->
        <!-- position="X Y Z" -> Y=1 hace que el texto flote un poco más arriba del marcador -->
        <!-- rotation="-90 0 0" hace que el texto quede acostado/paralelo a la pantalla -->
        <a-text 
          value="¡Lo estas haciendo genial!\nTu sonrisa cambia el dia." 
          position="0 1 0" 
          rotation="-90 0 0" 
          color="#FF5733" 
          align="center" 
          width="4"
          font="aileron">
        </a-text>
        
      </a-marker>
      
      <!-- La cámara virtual que renderiza los gráficos sobre el video real -->
      
      
    </a-scene>
  </body>
</html>
