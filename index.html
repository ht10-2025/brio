<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mensaje de Alegría AR</title>
    
    <!-- Librerías estables oficiales -->
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
    
    <style>
      /* Evitamos que el navegador recalcule el tamaño y apague la cámara */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
      
      /* Menú flotante estilo 'Overlay' para no alterar las dimensiones de la cámara */
      #interfaz-inicio {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        background: linear-gradient(135deg, rgba(30,60,114,0.95) 0%, rgba(42,82,152,0.95) 100%); 
        z-index: 9999; color: white; text-align: center; padding: 20px; box-sizing: border-box;
      }
      button {
        padding: 18px 40px; font-size: 20px; border: none; border-radius: 35px;
        background: linear-gradient(45deg, #FF5733, #FF8D1A); color: white; font-weight: bold; 
        cursor: pointer; margin-top: 25px; box-shadow: 0 5px 20px rgba(255,87,51,0.5);
      }
    </style>
  </head>
  <body>

    <!-- Menú de inicio flotante -->
    <div id="interfaz-inicio">
      <h2 style="font-size: 24px; margin-bottom: 5px;">✨ Portal de Bienestar ✨</h2>
      <p style="font-size: 15px; color: #e0e0e0; max-width: 280px;">Presiona el botón para estabilizar los sensores y descubrir tu mensaje.</p>
      <button onclick="iniciarExperiencia()">¡Activar Magia!</button>
    </div>

    <!-- La escena AR arranca de fondo inmediatamente para asegurar el permiso -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; facingMode: environment;" vr-mode-ui="enabled: false">
      
      <a-marker preset="hiro">
        <a-text 
          value="¡Lo estas haciendo genial!\nTu sonrisa cambia el dia." 
          position="0 0.6 0" 
          rotation="-90 0 0" 
          color="#FF5733" 
          align="center" 
          width="4">
        </a-text>
      </a-marker>

      
    </a-scene>

    <script>
      function iniciarExperiencia() {
        // En lugar de alterar la estructura del documento, desvanecemos la capa suavemente
        const capa = document.getElementById('interfaz-inicio');
        capa.style.transition = "opacity 0.4s ease";
        capa.style.opacity = "0";
        
        setTimeout(() => {
          capa.style.display = 'none';
          // Disparamos un evento global para acoplar la cámara si se quedó pausada
          window.dispatchEvent(new Event('resize'));
        }, 400);
      }
    </script>
  </body>
</html>
