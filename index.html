<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mensaje de Alegría AR</title>
    
    <!-- Librerías estables oficiales -->
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #000000; }
      #interfaz-inicio {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); z-index: 99999; color: white; text-align: center; padding: 20px;
      }
      button {
        padding: 18px 40px; font-size: 20px; border: none; border-radius: 35px;
        background: linear-gradient(45deg, #FF5733, #FF8D1A); color: white; font-weight: bold; 
        cursor: pointer; margin-top: 25px; box-shadow: 0 5px 20px rgba(255,87,51,0.5);
      }
    </style>
  </head>
  <body>

    <!-- Pantalla de bienvenida interactiva -->
    <div id="interfaz-inicio">
      <h2 style="font-size: 24px; margin-bottom: 5px;">✨ Portal de Bienestar ✨</h2>
      <p style="font-size: 15px; color: #e0e0e0; max-width: 280px;">Presiona el botón para dar permiso a la cámara y descubrir tu mensaje.</p>
      <button onclick="iniciarExperiencia()">¡Activar Magia!</button>
    </div>

    <!-- Escena AR vacía en espera de la señal de la cámara -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
      
      <a-marker preset="hiro">
        <a-text 
          value="¡Lo estas haciendo genial!\nTu sonrisa cambia el dia." 
          position="0 0.6 0" 
          rotation="-90 0 0" 
          color="#FF5733" 
          align="center" 
          width="4">
        </a-text>
      </a-marker>

      
    </a-scene>

    <script>
      // Pausamos la escena al cargar la página para evitar pantallas negras
      const escena = document.querySelector('a-scene');
      escena.pause();

      function iniciarExperiencia() {
        // Pedimos los permisos de la cámara directamente al sistema operativo del celular
        navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'environment' } // Forza el uso de la cámara trasera
        })
        .then(function(stream) {
          // Si el usuario acepta, ocultamos la interfaz azul
          document.getElementById('interfaz-inicio').style.display = 'none';
          
          // Despertamos el motor de Realidad Aumentada
          escena.play();
          
          // Forzamos al navegador a redibujar la pantalla para acoplar la cámara trasera
          setTimeout(() => {
            window.dispatchEvent(new Event('resize'));
          }, 300);
        })
        .catch(function(err) {
          // Mensaje de error amigable en caso de que falten permisos globales en el celular
          alert("Por favor, asegúrate de permitir el acceso a la cámara en los ajustes de tu navegador.");
          console.log("Error al abrir cámara: ", err);
        });
      }
    </script>
  </body>
</html>
