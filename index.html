<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mensaje de Alegría AR</title>
    
    <!-- Librerías oficiales con rutas fijas integradas (Carga instantánea) -->
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #121212; }
      #interfaz-inicio {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); z-index: 9999; color: white; text-align: center; padding: 20px;
      }
      button {
        padding: 16px 36px; font-size: 18px; border: none; border-radius: 30px;
        background: linear-gradient(45deg, #FF5733, #FF8D1A); color: white; font-weight: bold; 
        cursor: pointer; margin-top: 25px; box-shadow: 0 4px 15px rgba(255,87,51,0.4);
      }
    </style>
  </head>
  <body>

    <div id="interfaz-inicio">
      <h2>✨ Portal de Bienestar ✨</h2>
      <p>Presiona el botón para activar la cámara y descubrir tu mensaje.</p>
      <button onclick="iniciarExperiencia()">¡Activar Magia!</button>
    </div>

    <!-- Escena configurada en modo básico para máxima velocidad de procesamiento móvil -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-marker preset="hiro">
        <a-text 
          value="¡Lo estas haciendo genial!\nTu sonrisa cambia el dia." 
          position="0 0.5 0" 
          rotation="-90 0 0" 
          color="#FF5733" 
          align="center" 
          width="4">
        </a-text>
      </a-marker>

      
    </a-scene>

    <script>
      function iniciarExperiencia() {
        document.getElementById('interfaz-inicio').style.display = 'none';
        const scene = document.querySelector('a-scene');
        if (scene) { scene.resize(); }
      }
    </script>
  </body>
</html>
