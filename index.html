<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Portal AR Inicial ✨</title>
    
    <!-- Cargamos la librería líder para escaneo de video en tiempo real -->
    <script src="https://unpkg.com" type="text/javascript"></script>
    
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background-color: #000; }
      
      /* Contenedor donde se renderizará el video nativo */
      #lector-qr { width: 100% !important; height: 100% !important; position: fixed; top: 0; left: 0; object-fit: cover; z-index: 1; }
      #lector-qr video { width: 100% !important; height: 100% !important; object-fit: cover !important; }

      /* Capa de guía visual */
      #guia-escaneo {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; justify-content: space-between; align-items: center;
        padding: 40px 20px; box-sizing: border-box; z-index: 5; pointer-events: none;
      }
      .cuadro-mira {
        width: 220px; height: 220px; border: 3px dashed #00ff96; border-radius: 20px;
        box-shadow: 0 0 15px rgba(0, 255, 150, 0.4); margin: auto;
      }

      /* Mensaje sorpresa flotante */
      #mensaje-aliento {
        display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(15, 32, 39, 0.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border: 2px solid #FF8D1A; padding: 30px 20px; border-radius: 24px; text-align: center;
        width: 280px; box-sizing: border-box; box-shadow: 0 15px 35px rgba(0,0,0,0.6); z-index: 10;
      }
      .mostrar-mensaje { display: block !important; animation: brotar 0.4s ease-out forwards; }
      @keyframes brotar { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
    </style>
  </head>
  <body>

    <!-- El motor inyectará el video directamente en este bloque -->
    <div id="lector-qr"></div>

    <div id="guia-escaneo">
      <h2 style="margin: 0; font-size: 18px; color: #00ff96; text-shadow: 0 2px 4px #000; letter-spacing: 1px;">MODO ESCÁNER ACTIVO</h2>
      <div class="cuadro-mira"></div>
      <p style="font-size: 14px; color: #fff; background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px; font-weight: bold; text-shadow: 0 1px 2px #000;">
        Apunta al QR físico para activar tu mensaje
      </p>
    </div>

    <!-- El Mensaje Oculto -->
    <div id="mensaje-aliento">
      <span style="font-size: 32px;">✨</span>
      <h2 style="font-size: 22px; margin: 10px 0; color: #FF8D1A;">¡Validación Correcta!</h2>
      <p style="font-size: 16px; line-height: 1.5; margin: 0; color: #fff; font-weight: 500;">
        ¡Lo estás haciendo genial!<br>Tu sonrisa cambia el día.
      </p>
      <button onclick="window.location.reload()" style="margin-top: 20px; padding: 12px 24px; background: linear-gradient(45deg, #FF5733, #FF8D1A); color: white; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(255,87,51,0.3);">Volver a Escanear</button>
    </div>

    <script>
      const mensaje = document.getElementById('mensaje-aliento');
      const guia = document.getElementById('guia-escaneo');

      // Inicializamos el lector configurando un tamaño de cuadro de escaneo (fps óptimos)
      const html5QrcodeScanner = new Html5Qrcode("lector-qr");

      // Intentamos encender la cámara de forma fluida
      Html5Qrcode.getCameras().then(cameras => {
        if (cameras && cameras.length > 0) {
          // Si es celular detecta la cámara trasera automáticamente, si es PC usa la predeterminada
          let cameraId = cameras[0].id;
          if(cameras.length > 1) {
            // Busca la cámara trasera ("back" o "environment") en dispositivos móviles
            const trasera = cameras.find(c => c.label.toLowerCase().includes('back') || c.label.toLowerCase().includes('environment'));
            if(trasera) cameraId = trasera.id;
          }

          // Arranca el flujo de video a 24 cuadros por segundo (Carga inmediata)
          html5QrcodeScanner.start(
            cameraId, 
            { fps: 24, qrbox: { width: 250, height: 250 } },
            onScanSuccess
          ).catch(err => {
            console.error("Error al iniciar flujo", err);
          });
        }
      }).catch(err => {
        alert("Asegúrate de otorgar permisos de cámara en tu navegador.");
      });

      // Esta función se activa en el milisegundo exacto en que detecta CUALQUIER código QR
      function onScanSuccess(decodedText, decodedResult) {
        // Detenemos la cámara de inmediato para ahorrar batería e impedir lecturas dobles
        html5QrcodeScanner.stop().then(() => {
          guia.style.display = 'none';
          mensaje.classList.add('mostrar-mensaje');
        }).catch(err => {
          console.error("Fallo al detener la cámara", err);
        });
      }
    </script>
  </body>
</html>
