<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Portal AR Inicial ✨</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background-color: #000; }
      
      /* Video nativo de la cámara de fondo */
      #video-camara { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }

      /* Interfaz de guía visual verde */
      #guia-escaneo {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; justify-content: space-between; align-items: center;
        padding: 40px 20px; box-sizing: border-box; z-index: 5; pointer-events: none;
      }
      .cuadro-mira {
        width: 220px; height: 220px; border: 3px dashed #00ff96; border-radius: 20px;
        box-shadow: 0 0 15px rgba(0, 255, 150, 0.4); margin: auto; position: relative;
      }
      .cuadro-mira::after {
        content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
        background-color: #00ff96; box-shadow: 0 0 8px #00ff96; animation: escanear 2s infinite ease-in-out;
      }

      /* Tarjeta del Mensaje Sorpresa */
      #mensaje-aliento {
        display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(15, 32, 39, 0.96); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border: 2px solid #FF8D1A; padding: 30px 20px; border-radius: 24px; text-align: center;
        width: 280px; box-sizing: border-box; box-shadow: 0 15px 35px rgba(0,0,0,0.6); z-index: 10;
      }
      .mostrar-mensaje { display: block !important; animation: brotar 0.4s ease-out forwards; }
      
      @keyframes escanear { 0%, 100% { top: 0%; } 50% { top: 100%; } }
      @keyframes brotar { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
    </style>
  </head>
  <body>

    <!-- La cámara se proyectará aquí -->
    <video id="video-camara" autoplay playsinline muted></video>

    <!-- Guía del visor sobre la pantalla -->
    <div id="guia-escaneo">
      <h2 style="margin: 0; font-size: 18px; color: #00ff96; text-shadow: 0 2px 4px #000; letter-spacing: 1px;">MODO ESCÁNER ACTIVO</h2>
      <div class="cuadro-mira"></div>
      <p style="font-size: 14px; color: #fff; background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px; font-weight: bold; text-shadow: 0 1px 2px #000;">
        Apunta al QR físico para activar tu mensaje
      </p>
    </div>

    <!-- El Mensaje Oculto que SOLO saldrá si el motor lee un QR físico -->
    <div id="mensaje-aliento">
      <span style="font-size: 32px;">✨</span>
      <h2 style="font-size: 22px; margin: 10px 0; color: #FF8D1A;">¡Validación Correcta!</h2>
      <p style="font-size: 16px; line-height: 1.5; margin: 0; color: #fff; font-weight: 500;">
        ¡Lo estás haciendo genial!<br>Tu sonrisa cambia el día.
      </p>
      <button onclick="window.location.reload()" style="margin-top: 20px; padding: 12px 24px; background: linear-gradient(45deg, #FF5733, #FF8D1A); color: white; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(255,87,51,0.3);">Volver a Escanear</button>
    </div>

    <script>
      const video = document.getElementById('video-camara');
      const mensaje = document.getElementById('mensaje-aliento');
      const guia = document.getElementById('guia-escaneo');
      let escaneoActivo = true;
      let detectorNativo;

      // 1. Verificamos si el navegador posee soporte nativo para leer códigos
      if ('BarcodeDetector' in window) {
        detectorNativo = new BarcodeDetector({ formats: ['qr_code'] });
      } else {
        alert("Tu navegador no soporta el motor nativo de escaneo. Inténtalo desde un celular con Chrome o Brave actualizado.");
      }

      // 2. Encendemos la cámara (Usa trasera en celular, y frontal o webcam predeterminada en PC)
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(conectarStream)
      .catch(function() {
        navigator.mediaDevices.getUserMedia({ video: true })
        .then(conectarStream)
        .catch(function() {
          alert("Error crítico al acceder a la cámara. Por favor concede los permisos en tu navegador.");
        });
      });

      function conectarStream(stream) {
        video.srcObject = stream;
        video.play();
        
        // Ejecutamos el bucle nativo una vez que el video cargue por completo sus dimensiones
        video.addEventListener('loadedmetadata', function() {
          if (detectorNativo) {
            bucleDeteccionNativa();
          }
        });
      }

      // 3. Motor de bucle de escaneo a nivel de hardware
      function bucleDeteccionNativa() {
        if (!escaneoActivo) return;

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          // El método "detect" analiza directamente el fotograma del elemento de video nativo
          detectorNativo.detect(video)
          .then(barcodes => {
            if (barcodes.length > 0 && escaneoActivo) {
              escaneoActivo = false; // Rompemos el bucle
              
              // Apagamos la cámara de fondo
              const stream = video.srcObject;
              if (stream) stream.getTracks().forEach(track => track.stop());
              
              // Desplegamos el mensaje
              guia.style.display = 'none';
              mensaje.classList.add('mostrar-mensaje');
            }
          })
          .catch(err => console.error("Error en detección de hardware: ", err));
        }

        // Corre el siguiente análisis atado al rendimiento del celular
        if (escaneoActivo) {
          requestAnimationFrame(bucleDeteccionNativa);
        }
      }
    </script>
  </body>
</html>
