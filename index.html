<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Portal AR Inicial ✨</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background-color: #000; }
      
      #video-camara { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }

      /* Interfaz de guía visual verde */
      #guia-escaneo {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; justify-content: space-between; align-items: center;
        padding: 40px 20px; box-sizing: border-box; z-index: 5; pointer-events: none;
        transition: opacity 0.5s ease;
      }
      .cuadro-mira {
        width: 220px; height: 220px; border: 3px dashed #00ff96; border-radius: 20px;
        box-shadow: 0 0 15px rgba(0, 255, 150, 0.4); margin: auto; position: relative;
        transition: all 0.3s ease;
      }
      
      #laser {
        content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
        background-color: #00ff96; box-shadow: 0 0 8px #00ff96; animation: escanear 2s infinite ease-in-out;
      }

      .procesando-mira { border-color: #FF8D1A !important; box-shadow: 0 0 25px rgba(255, 141, 26, 0.6) !important; }
      .procesando-laser { background-color: #FF8D1A !important; box-shadow: 0 0 15px #FF8D1A !important; animation: procesar 0.3s infinite alternate !important; }

      /* NUEVA TARJETA ENRIQUECIDA (Efecto cristal de alta calidad) */
      #mensaje-aliento {
        display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
        background: linear-gradient(135deg, rgba(15, 32, 39, 0.95) 0%, rgba(32, 58, 67, 0.95) 100%);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        border: 2px solid rgba(255, 141, 26, 0.5); padding: 30px 25px; border-radius: 30px; text-align: center;
        width: 300px; box-sizing: border-box; box-shadow: 0 20px 50px rgba(0,0,0,0.7); z-index: 10;
        opacity: 0;
        transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      
      .mostrar-mensaje { display: block !important; opacity: 1 !important; transform: translate(-50%, -50%) scale(1) !important; }
      
      /* Elemento animado dinámico dentro de la tarjeta */
      .icono-animado {
        font-size: 50px; margin-bottom: 10px; display: inline-block;
        animation: latido 1.2s infinite alternate cubic-bezier(0.215, 0.610, 0.355, 1);
      }

      button {
        padding: 14px 28px; font-size: 16px; border: none; border-radius: 25px;
        background: linear-gradient(45deg, #FF5733, #FF8D1A); color: white; font-weight: bold; 
        cursor: pointer; margin-top: 25px; box-shadow: 0 5px 15px rgba(255,87,51,0.4);
        transition: all 0.2s ease; pointer-events: auto; width: 100%;
      }
      button:active { transform: scale(0.97); box-shadow: 0 2px 5px rgba(255,87,51,0.2); }
      
      @keyframes escanear { 0%, 100% { top: 0%; } 50% { top: 100%; } }
      @keyframes procesar { 0% { top: 20%; opacity: 0.4; } 100% { top: 80%; opacity: 1; } }
      @keyframes latido { 0% { transform: scale(0.9); filter: drop-shadow(0 0 2px rgba(255,255,255,0.2)); } 100% { transform: scale(1.1); filter: drop-shadow(0 0 15px rgba(255,141,26,0.6)); } }
    </style>
  </head>
  <body>

    <video id="video-camara" autoplay playsinline muted></video>

    <div id="guia-escaneo">
      <h2 id="texto-estado" style="margin: 0; font-size: 18px; color: #00ff96; text-shadow: 0 2px 4px #000; letter-spacing: 1px;">MODO ESCÁNER ACTIVO</h2>
      <div class="cuadro-mira" id="mira">
        <div id="laser"></div>
      </div>
      <p id="texto-inferior" style="font-size: 14px; color: #fff; background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px; font-weight: bold; text-shadow: 0 1px 2px #000;">
        Apunta al QR físico para activar tu mensaje
      </p>
    </div>

    <!-- TARJETA MEJORADA CON ICONO DE LATIDO Y ESTILOS PULIDOS -->
    <div id="mensaje-aliento">
      <div class="icono-animado">✨💛✨</div>
      <h2 style="font-size: 24px; margin: 10px 0 5px 0; background: linear-gradient(45deg, #FFF, #FF8D1A); -webkit-background-clip-: text; -webkit-text-fill-color: transparent; font-weight: 800;">¡Sintonía Exitosa!</h2>
      <p style="font-size: 16px; line-height: 1.6; margin: 10px 0 0 0; color: #f0f0f0; font-weight: 400;">
        ¡Lo estás haciendo genial!<br>
        <span style="color: #FF8D1A; font-weight: bold;">Tu sonrisa cambia el día.</span>
      </p>
      <button onclick="window.location.reload()">Volver a Escanear</button>
    </div>

    <script>
      const video = document.getElementById('video-camara');
      const mensaje = document.getElementById('mensaje-aliento');
      const guia = document.getElementById('guia-escaneo');
      const mira = document.getElementById('mira');
      const laser = document.getElementById('laser');
      const textoEstado = document.getElementById('texto-estado');
      const textoInferior = document.getElementById('texto-inferior');
      
      let escaneoActivo = true;
      let detectorNativo;

      // 🛑 REGLA DE SEGURIDAD: Reemplaza esta URL exacta por el enlace de TU página web de GitHub Pages
      // Ejemplo: "https://github.io"
      const MI_URL_OFICIAL = window.location.href; 

      if ('BarcodeDetector' in window) {
        detectorNativo = new BarcodeDetector({ formats: ['qr_code'] });
      } else {
        alert("Tu navegador no soporta el motor nativo de escaneo.");
      }

      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(conectarStream)
      .catch(function() {
        navigator.mediaDevices.getUserMedia({ video: true }).then(conectarStream);
      });

      function conectarStream(stream) {
        video.srcObject = stream;
        video.play();
        video.addEventListener('loadedmetadata', function() {
          if (detectorNativo) { bucleDeteccionNativa(); }
        });
      }

      function bucleDeteccionNativa() {
        if (!escaneoActivo) return;

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          detectorNativo.detect(video)
          .then(barcodes => {
            if (barcodes.length > 0 && escaneoActivo) {
              
              // Extraemos el texto plano o enlace que contiene el QR físico capturado
              const contenidoQR = barcodes[0].rawValue;
              
              // VALIDACIÓN ESTRICTA: ¿El QR escaneado es el de nuestra propia web?
              // Usamos 'includes' para cerciorarnos de que apunte a nuestro hosting de GitHub o dominio
              if (contenidoQR.includes("github.io") || contenidoQR === MI_URL_OFICIAL) {
                escaneoActivo = false; 
                ejecutarTransicionMagica();
              } else {
                console.log("QR ignorado por no ser el oficial del Portal.");
              }
            }
          })
          .catch(err => console.error(err));
        }

        if (escaneoActivo) { requestAnimationFrame(bucleDeteccionNativa); }
      }

      function ejecutarTransicionMagica() {
        mira.classList.add('procesando-mira');
        laser.classList.add('procesando-laser');
        textoEstado.style.color = '#FF8D1A';
        textoEstado.innerText = 'PROCESANDO ENERGÍA';
        textoInferior.innerText = '⚡ Sincronizando vibras...';

        setTimeout(() => {
          guia.style.opacity = '0';
          setTimeout(() => {
            guia.style.display = 'none';
            const stream = video.srcObject;
            if (stream) stream.getTracks().forEach(track => track.stop());
            mensaje.classList.add('mostrar-mensaje');
          }, 400);
        }, 1500);
      }
    </script>
  </body>
</html>
